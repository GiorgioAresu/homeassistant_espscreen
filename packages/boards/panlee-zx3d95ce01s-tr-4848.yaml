# ESP Screens - ZX3D95CE01S-TR-4848 board: 4-inch EU wallbox, 480x480 IPS (GC9503V over RGB) + GT911
# capacitive touch, an ESP32-S3 with 16 MB flash and 8 MB of octal PSRAM.
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together, docs/GUITION.md what this board needs.
# Everything else (the LVGL tree, the cards, the scripts, the entities) is packages/core.yaml, which every board
# shares. Two entry files include this one: checkout/guition.yaml (a build on this computer) and
# packages/guition.yaml (the package a screen builds from over GitHub).
packages:
  # The chip, its PSRAM and the ESP-IDF settings every ESP32-S3 RGB panel shares (and through it how every board's
  # firmware is built).
  hardware: !include ../hardware/esp32s3-rgb.yaml
  # Every size of the standard look, scaled to DISPLAY_DPI below. This glass is where that look was drawn.
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "zx3d95ce01s-tr-4848"
  DEVICE_NAME: "zx3d95ce01s-tr-4848-new"
  DEVICE_FRIENDLY_NAME: "My ZX3D95CE01S-TR-4848"

  # The glass: the panel's own pixels, which the display block below always drives, and its density (diagonal
  # pixels / diagonal inches). The standard look takes 170 as its reference, so every size here is the look's own.
  PANEL_W: "480"
  PANEL_H: "480"
  DISPLAY_DPI: "170"
  # The tile grid: columns and rows of cells. The shared tree places every cell from these
  # (runtime_tiles::place_page). Square glass: the same six cells whichever way it hangs.
  GRID_COLS: "2"
  # Three rows, or four when the screen is built that way (boards.yaml `choices`, firmware 0.18.1): eight smaller
  # cells a page, about 11 mm high, for a screen of many switches. A saved layout follows to four rows by itself.
  GRID_ROWS: "3"
  # More tiles and pages than the 64 and eight of a board without PSRAM (firmware 0.34.0+): the tile list, the cards and the
  # extras live in PSRAM here, and the memory budget (tile_memory.h) says how many of them a layout really takes.
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"                   # a wider top bar where the glass has the width for it
  LVGL_BUFFER_SIZE: "25%"                       # LVGL's draw buffer as a share of the screen

  # Hardware a screen's own YAML may change (docs/EASY_SETUP.md, "Hardware-specific YAML overrides")
  BACKLIGHT_FREQUENCY: "5kHz"                  # the backlight's PWM; see the output block (GitHub #5)

# ============================================================
# No need to edit below this line.
# ============================================================

esp32:
  flash_size: 16MB

logger:
  tx_buffer_size: 2048
  hardware_uart: UART0

text_sensor:
  - platform: template
    name: "Panlee screen type"
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {"panlee"};'

spi:
  id: lcd
  clk_pin:
    number: 45
    allow_other_uses: true
    ignore_strapping_warning: true
  mosi_pin:
    number: 48
    allow_other_uses: true

i2c:
  id: touch_bus
  sda: 15
  scl: 6
  scan: true
  frequency: 400kHz

output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: 5
    frequency: ${BACKLIGHT_FREQUENCY}

touchscreen:
  - platform: ft63x6
    interrupt_pin: 4
    id: ts_touch
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480

# Native ESPHome driver with the working manufacturer's LVGL demo timings.
# See docs/GUITION_FACTORY_REFERENCE.md; no custom RGB component is required.
display:
  - platform: mipi_rgb
    model: ZX3D95CE01S-TR-4848
    id: my_display

external_components:
  - source: github://GiorgioAresu/esphome@mipi-rgb-gc9503v
    components: [ mipi_rgb ]
    refresh: always